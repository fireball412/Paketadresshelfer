<!doctype html>
<html lang="de"><meta charset="utf-8"><title>Paketadresshelfer – lokale Testseite</title>
<style>body{max-width:760px;margin:30px auto;font:16px Arial;padding:16px}label{display:block;margin:12px 0}input{display:block;padding:8px;width:90%}fieldset{margin:20px 0}button{padding:8px}</style>
<h1>Lokaler Formulartest</h1><p>Die Skripte werden hier direkt geladen. Es sind keine zusätzlichen Erweiterungsrechte für lokale Dateien nötig.</p>
<button type="button" id="mount">Empfängerformular dynamisch ersetzen</button>
<label><input type="checkbox" id="combined" checked>Gemeinsames Namensfeld wie bei DHL</label>
<fieldset><legend>Absender</legend><label>Vorname<input name="senderFirstName" value="Nicht ändern"></label><label>Ort<input name="senderCity" value="Nicht ändern"></label></fieldset>
<div id="container"></div><pre id="events" aria-live="polite"></pre>
<template id="fixture"><form onsubmit="return false"><fieldset><legend>Empfänger</legend>
<label>Vorname<input name="firstName" autocomplete="given-name"></label>
<label>Nachname<input name="lastName" autocomplete="family-name"></label>
<label>Straße<input name="street"></label>
<label>Hausnummer<input name="houseNumber"></label>
<label>Postleitzahl<input name="postalCode" autocomplete="postal-code"></label>
<label>Ort<input name="city" autocomplete="address-level2" value="Unverändert (DHL-Simulation)"></label>
</fieldset></form></template>
<script src="../src/addressParser.js"></script><script src="../src/config.js"></script><script src="../src/formDetector.js"></script><script src="../src/formFiller.js"></script><script src="../src/content.js"></script>
<script>
const container=document.getElementById('container');
function mount(){
container.replaceChildren(document.getElementById('fixture').content.cloneNode(true));
if(document.getElementById('combined').checked){
const first=container.querySelector('[name="firstName"]');
first.parentElement.firstChild.textContent='Vor- und Nachname';first.name='fullName';first.autocomplete='name';
container.querySelector('[name="lastName"]').parentElement.remove();
}
document.getElementById('events').textContent='';}
document.getElementById('combined').addEventListener('change',mount);
document.getElementById('mount').addEventListener('click',mount);
for(const eventName of ['input','change','blur','focusout']) container.addEventListener(eventName,event=>{
if(event.target instanceof HTMLInputElement) document.getElementById('events').textContent += eventName+': '+event.target.name+'\n';
},true);
setTimeout(mount,300);
</script></html>
